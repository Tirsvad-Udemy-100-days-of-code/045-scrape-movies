# Quality checks (ruff, mypy) for the Python files of this repository.
#
# Triggers: every pull request and every push to main.
# Calls the reusable workflow of TirSystem/git-workflows at the major tag v2
# (same organisation, the tag moves with compatible releases). It changes no
# file, needs no secret and writes nothing outside the repository.
# Implements MIL-001 (Go/No-Go criterion 5: CI evidence). Verified on the
# Gitea instance git.tirsystem.com.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    permissions:
      contents: read
    uses: TirSystem/git-workflows/.gitea/workflows/quality-checks.yml@v2
    with:
      languages: python
